<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>젠더 밸런스 게임</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        #game-container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-select { background: #e1f5fe; color: #0288d1; }
        .btn-select:hover { background: #0288d1; color: white; }
        .progress { font-size: 14px; color: #888; margin-bottom: 20px; }
        #result { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="quiz">
        <div class="progress" id="progress">질문 1 / 12</div>
        <h2 id="question">질문을 불러오는 중입니다...</h2>
        <div id="options"></div>
    </div>

    <div id="result">
        <h1>테스트 결과</h1>
        <h2 id="result-type" style="color: #0288d1;">유형 이름</h2>
        <p id="result-desc">유형 설명이 들어갑니다.</p>
        <hr>
        <p><strong>분석:</strong> <span id="result-analysis"></span></p>
        <p><em>" <span id="result-conclusion"></span> "</em></p>
    </div>
</div>

<script>
    // score: [고정관념 답변 3점, 반대 답변 2점, 모두/중립 답변 1점]
    const questions = [
        { q: "간호사라고 하면 먼저 떠오르는 성별은?", a: ["여성", "남성", "모두"], score: [3, 2, 1] },
        { q: "군인/소방관 하면 더 자연스럽게 떠오는 성별은?", a: ["남성", "여성", "모두"], score: [3, 2, 1] },
        { q: "유치원 선생님은 어느 성별이 더 어울린다고 생각하나요?", a: ["여성", "남성", "모두"], score: [3, 2, 1] },
        { q: "감정을 잘 표현하는 사람은 보통 어떤 성별인가요?", a: ["여성", "남성", "모두"], score: [3, 2, 1] },
        { q: "위기 상황에서 더 침착할 것 같은 성별은?", a: ["남성", "여성", "모두"], score: [3, 2, 1] },
        { q: "카페에서 혼자 울고 있는 사람, 더 걱정되는 쪽은?", a: ["여성", "남성", "모두"], score: [3, 2, 1] },
        { q: "데이트 비용을 더 많이 부담하는 게 자연스러운 쪽은?", a: ["남성", "여성", "모두"], score: [3, 2, 1] },
        { q: "운전을 더 잘할 것 같은 성별은?", a: ["남성", "여성", "모두"], score: [3, 2, 1] },
        { q: "수학/과학 분야에 더 강할 것 같은 성별은?", a: ["남성", "여성", "모두"], score: [3, 2, 1] },
        { q: "아이를 돌보는 데 더 능숙할 것 같은 성별은?", a: ["여성", "남성", "모두"], score: [3, 2, 1] },
        { q: "남성이 화장을 하는 것에 대해 어떻게 생각하나요?", a: ["긍정적이다", "어색하다", "부정적이다"], score: [1, 2, 3] },
        { q: "여성이 리드하는 연애 스타일에 대해 어떻게 생각하나요?", a: ["긍정적이다", "어색하다", "부정적이다"], score: [1, 2, 3] }
    ];

    let currentIdx = 0;
    let totalScore = 0;

    function loadQuestion() {
        if (currentIdx >= questions.length) {
            showResult();
            return;
        }
        const qData = questions[currentIdx];
        document.getElementById('progress').innerText = `질문 ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('question').innerText = qData.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        qData.a.forEach((text, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-select';
            btn.innerText = text;
            btn.onclick = () => {
                totalScore += qData.score[i];
                currentIdx++;
                loadQuestion();
            };
            optionsDiv.appendChild(btn);
        });
    }

    function showResult() {
        document.getElementById('quiz').style.display = 'none';
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';

        let type = "", desc = "", analysis = "", conclusion = "";

        // 점수 기준 조정 (최대 36점, 최소 12점)
        if (totalScore >= 30) {
            type = "유형 A: 성별 필터 100% 장착형";
            desc = "남녀의 역할이 명확히 구분되어야 사회가 효율적으로 돌아간다고 믿는 타입입니다.";
            analysis = "본인은 합리적이라 생각하지만, 사실은 사회가 정해준 틀(Gender Box)에 갇혀 있을 가능성이 높습니다.";
            conclusion = "차이를 이해하는 힘이 조금 더 필요해요! 당신의 틀이 타인의 가능성을 제한할 수도 있습니다.";
        } else if (totalScore >= 18) {
            type = "유형 B: 의식적 노력형";
            desc = "평소 평등을 지향하지만, 특정 상황에서는 자신도 모르게 성별을 따집니다.";
            analysis = "머리로는 알지만 무의식에는 여전히 사회적 학습 내용이 남아 있는 상태입니다.";
            conclusion = "당신은 이미 훌륭한 관점을 가졌습니다. 다만, '당연함'이라는 이름의 편견을 조금만 더 의심해 보세요.";
        } else {
            type = "유형 C: 젠더 프리(Gender-Free) 탐험가";
            desc = "사람을 성별이 아닌 '개인'의 특성으로 보려 노력하는 타입입니다.";
            analysis = "성별 이분법에서 벗어나 유연한 사고를 함. 갈등 상황에서 중재자 역할을 잘할 타입입니다.";
            conclusion = "당신이야말로 이 과목이 찾는 '차이를 이해하는 힘'을 가진 사람입니다!";
        }

        document.getElementById('result-type').innerText = type;
        document.getElementById('result-desc').innerText = desc;
        document.getElementById('result-analysis').innerText = analysis;
        document.getElementById('result-conclusion').innerText = conclusion;

        // 구글 시트 전송 로직 (생략 없음)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwzt6mk8sCRhqzKgASGvkKRS09tgkl1EhpsJtDGq3kH6AuzDZY25Y_IWYxITea0BWfk/exec';
        const formData = new URLSearchParams();
        formData.append('score', totalScore);
        formData.append('type', type);

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        }).catch(error => console.error('에러 발생:', error));
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
